name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x86, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore MewSwitchManager.csproj
      - name: Build
        run: dotnet build MewSwitchManager.csproj --configuration Release --no-restore --nologo
      - name: Publish
        run: dotnet publish MewSwitchManager.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --nologo
      - name: Test core regression suite
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem -Path Tests -Filter *.cs -File
          if ($testFiles.Count -eq 0) { throw 'No regression tests found.' }
          Write-Host "Regression test sources found: $($testFiles.Count)"
