name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x86, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore application
        run: dotnet restore MewNX.csproj
      - name: Restore tests
        run: dotnet restore Tests/MewNX.Tests.csproj
      - name: Build application
        run: dotnet build MewNX.csproj --configuration Release --no-restore --nologo -warnaserror
      - name: Build tests
        run: dotnet build Tests/MewNX.Tests.csproj --configuration Release --no-restore --nologo -warnaserror
      - name: Run regression tests
        run: dotnet test Tests/MewNX.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal --nologo
      - name: Publish ${{ matrix.rid }}
        run: dotnet publish MewNX.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --nologo
