name: MewSwitch Manager — Windows CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: MewSwitchManager.csproj
  VERSION: 0.4.0-alpha.1

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: arm64
            rid: win-arm64
          - arch: x86
            rid: win-x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Clean stale output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force bin,obj,dist -ErrorAction SilentlyContinue

      - name: Restore
        run: dotnet restore $env:PROJECT

      - name: Build Release
        run: dotnet build $env:PROJECT -c Release --no-restore -p:GitCommit=${{ github.sha }}

      - name: Publish self-contained single-file
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:GitCommit=${{ github.sha }} `
            --no-restore `
            -o dist

      - name: Validate artifact
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/MewSwitch Manager.exe'
          $cfg = Join-Path $PWD 'dist/appsettings.json'
          if (-not (Test-Path $exe)) { throw 'Published EXE was not generated.' }
          if (-not (Test-Path $cfg)) { throw 'appsettings.json was not published.' }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw "Published EXE is unexpectedly small: $size bytes" }
          Write-Host "${{ matrix.arch }} EXE OK: $size bytes"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          (Get-FileHash 'dist/MewSwitch Manager.exe' -Algorithm SHA256).Hash + '  MewSwitch Manager.exe' | Set-Content 'dist/SHA256SUMS.txt'

      - name: Package Windows artifact
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'dist/MewSwitch Manager.exe','dist/appsettings.json','dist/SHA256SUMS.txt' `
            -DestinationPath 'MewSwitch-Manager-${{ matrix.arch }}.zip' `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MewSwitch-Manager-${{ matrix.arch }}
          path: MewSwitch-Manager-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MewSwitch-Manager-x64
          path: release
      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MewSwitch-Manager-arm64
          path: release
      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: MewSwitch-Manager-x86
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
