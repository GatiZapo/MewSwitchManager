name: Release gate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.0-alpha.1'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]] || { echo 'Invalid tag'; exit 1; }
