name: MewNX — Regression Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mewnx-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Core regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore tests
        run: dotnet restore Tests/MewNX.Tests.csproj

      - name: Build tests (warnings are errors)
        run: dotnet build Tests/MewNX.Tests.csproj -c Release --no-restore -warnaserror

      - name: Run regression tests
        run: dotnet test Tests/MewNX.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=mewnxtests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MewNX-regression-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  app-build:
    name: Windows release build smoke test
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore application
        run: dotnet restore MewNX.csproj

      - name: Build application (warnings are errors)
        run: dotnet build MewNX.csproj -c Release --no-restore -warnaserror

      - name: Publish x64 smoke artifact
        run: dotnet publish MewNX.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore -o regression-dist

      - name: Validate published executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'regression-dist/MewNX.exe'
          if (-not (Test-Path $exe)) { throw 'MewNX.exe was not produced.' }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Published executable is unexpectedly small.' }
          Write-Host "Regression publish OK: $((Get-Item $exe).Length) bytes"
